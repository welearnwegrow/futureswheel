  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <label style=\"display:flex; flex-direction:column; gap:7px;\">\n            <span style=\"font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); font-weight:700;\">Where are you noticing it?<\u002Fspan>\n            <input type=\"text\" placeholder=\"e.g. government schools in rural Karnataka\" value=\"{{ whereVal }}\" sc-camel-on-change=\"{{ onWhere }}\" style=\"width:100%; min-width:0; border:1px solid var(--rule); background:var(--surface-0); color:var(--ink); font-family:'DM Sans', sans-serif; font-size:16px; padding:12px 14px; border-radius:10px; outline:none;\" style-focus=\"border-color:var(--amber);\">\n          <\u002Flabel>\n          <div style=\"display:flex; justify-content:flex-end;\">\n            <button type=\"submit\" disabled=\"{{ mapBusy }}\" style=\"font-family:'DM Sans', sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; border:none; border-radius:11px; padding:13px 20px; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--amber); color:#2A2113;\" style-hover=\"background:var(--amber-dark);\" style-active=\"transform:translateY(1px);\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n              <span>Map consequences<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; color:var(--ink-3); margin:12px 2px 0;\"><span>{{ metaPre }}<\u002Fspan><span style=\"color:var(--dim-POLI);\">{{ metaWarn }}<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:22px;\">\n          <div style=\"font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:10px;\">Or start from one of these<\u002Fdiv>\n          <div e=\"display:inline-flex; align-items:center; gap:9px; color:var(--ink-2); font-size:13.5px; padding:4px 2px; white-space:nowrap;\">\n                    <span style=\"width:15px; height:15px; border:2px solid var(--rule); border-top-color:var(--amber); border-radius:999px; animation:spin .7s linear infinite;\"><\u002Fspan>\n                    <span>{{ spinner.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"position:absolute; transform:translate(-50%, -50%); z-index:3; left:{{ center }}; top:{{ center }};\">\n                <div style=\"width:178px; background:var(--ink); color:var(--surface-0); border:1px solid var(--ink); box-shadow:var(--shadow-lift); text-align:center; border-radius:14px; padding:15px;\">\n                  <div style=\"font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); font-weight:700; margin-bottom:5px;\">The change<\u002Fdiv>\n                  <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:17px; line-height:1.14;\">{{ trend }}<\u002Fdiv>\n                  <sc-if value=\"{{ lensSummary }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px; line-height:1.35; margin-top:8px; opacity:.72;\">Noticed in: {{ lensSummary }}<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n\n      <div style=\"margin-top:24px; background:var(--surface-1); border:1px solid var(--rule); border-radius:18px; padding:clamp(18px, 3vw, 28px); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:24px;\">\n        <div style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px;\">\n          <div>\n            <h3 style=\"font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(22px, 3vw, 30px); margin:0 0 4px; letter-spacing:-.01em;\">Implications report<\u002Fh3>\n            <p style=\"margin:0; color:var(--ink-2); font-size:14px; max-width:60ch;\">Key insights by time horizon, then the themes running through the map, with possibilities for intervention across the full range, from refusing the trend to adopting it with care, and the risks to watch in each.<\u002Fp>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onReport }}\" disabled=\"{{ reportBusy }}\" style=\"font-family:'DM Sans', sans-serif; font-weight:700; cursor:pointer; background:var(--amber); color:#2A2113; border:none; padding:11px 18px; font-size:14px; border-radius:10px; white-space:nowrap;\" style-hover=\"background:var(--amber-dark);\">{{ reportLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ askLead }}\" hint-placeholder-val=\"{{ false }}\">\n          <form sc-camel-on-submit=\"{{ onLeadSubmit }}\" style=\"display:flex; flex-direction:column; gap:12px; background:var(--surface-0); border:1px solid var(--rule); border-radius:14px; padding:18px;\">\n            <div style=\"display:flex; flex-direction:column; gap:3px;\">\n              <span style=\"font-size:15px; font-weight:700;\">Before we write your report<\u002Fspan>\n              <span style=\"font-size:13px; color:var(--ink-2);\">Add your name and email. We keep them with the trend you mapped, and this browser remembers them for next time. <a href=\"{{ privacyHref }}\" target=\"_blank\" rel=\"noopener\">Privacy<\u002Fa><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n              <input type=\"text\" aria-label=\"Your name\" placeholder=\"Your name\" autocomplete=\"name\" value=\"{{ leadName }}\" sc-camel-on-change=\"{{ onLeadName }}\" style=\"min-width:0; flex:1 1 200px; border:1px solid var(--rule); background:var(--surface-0); color:var(--ink); font-family:'DM Sans', sans-serif; font-size:15px; padding:11px 13px; border-radius:10px; outline:none;\" style-focus=\"border-color:var(--amber);\">\n              <input type=\"email\" aria-label=\"Email address\" placeholder=\"Email address\" autocomplete=\"email\" value=\"{{ leadEmail }}\" sc-camel-on-change=\"{{ onLeadEmail }}\" style=\"min-width:0; flex:1 1 200px; border:1px solid var(--rule); background:var(--surface-0); color:var(--ink); font-family:'DM Sans', sans-serif; font-size:15px; padding:11px 13px; border-radius:10px; outline:none;\" style-focus=\"border-color:var(--amber);\">\n              <button type=\"submit\" style=\"font-family:'DM Sans', sans-serif; font-weight:700; cursor:pointer; background:var(--amber); color:#2A2113; border:none; padding:11px 18px; font-size:14px; border-radius:10px; white-space:nowrap;\" style-hover=\"background:var(--amber-dark);\">Continue<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ leadError }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12.5px; color:var(--dim-POLI);\">{{ leadError }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ reportPh }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0; font-size:14px; color:var(--ink-3);\">{{ reportPh }}<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasInsights }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <p style=\"font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin:0;\">Key insights<\u002Fp>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:14px;\">\n              <sc-for list=\"{{ horizons }}\" as=\"hz\" hint-placeholder-count=\"3\">\n                <div style=\"background:var(--surface-0); border:1px solid var(--rule); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:10px;\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:8px;\">\n                    <span style=\"font-family:'DM Serif Display', Georgia, serif; font-size:19px;\">{{ hz.name }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--ink-3); white-space:nowrap;\">{{ hz.range }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <ul style=\"margin:0; padding:0 0 0 18px; display:flex; flex-direction:column; gap:8px; font-size:14px; line-height:1.45; color:var(--ink);\">\n                    <sc-for list=\"{{ hz.items }}\" as=\"it\" hint-placeholder-count=\"3\"><li style=\"text-wrap:pretty;\">{{ it }}<\u002Fli><\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasThemes }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <p style=\"font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin:0;\">Themes, interventions and risks<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:14px;\">\n              <sc-for list=\"{{ themes }}\" as=\"th\" hint-placeholder-count=\"4\">\n                <div style=\"background:var(--surface-0); border:1px solid var(--rule); border-radius:14px; padding:18px 20px; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:16px 28px;\">\n                  <div style=\"display:flex; flex-direction:column; gap:6px; grid-column:1 / -1;\">\n                    <div style=\"display:flex; align-items:baseline; gap:10px;\">\n                      <span style=\"font-family:'DM Serif Display', Georgia, serif; font-size:15px; color:var(--amber-dark); font-variant-numeric:tabular-nums;\">{{ th.num }}<\u002Fspan>\n                      <span style=\"font-family:'DM Serif Display', Georgia, serif; font-size:21px; line-height:1.2;\">{{ th.name }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ th.summary }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0; color:var(--ink-2); font-size:14px; max-width:75ch; text-wrap:pretty;\">{{ th.summary }}<\u002Fp><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ th.hasInt }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; flex-direction:column; gap:10px;\">\n                      <span style=\"font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#5E7A4A;\">Possibilities for intervention<\u002Fspan>\n                      <sc-for list=\"{{ th.interventions }}\" as=\"iv\" hint-placeholder-count=\"2\">\n                        <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n                          <span style=\"width:10px; height:10px; border-radius:3px; flex:none; margin-top:5px; background:#E3EFD9; border:1px solid #C5D9B4;\"><\u002Fspan>\n                          <div style=\"display:flex; flex-direction:column; gap:5px; min-width:0;\">\n                            <span style=\"font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:{{ iv.stanceColor }};\">{{ iv.stanceLabel }}<\u002Fspan>\n                            <span style=\"font-size:14px; line-height:1.45; text-wrap:pretty;\">{{ iv.text }}<\u002Fspan>\n                            <sc-if value=\"{{ iv.hasTags }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex; flex-wrap:wrap; gap:4px;\"><sc-for list=\"{{ iv.tags }}\" as=\"tg\" hint-placeholder-count=\"1\"><span style=\"font-size:10.5px; color:var(--ink-2); background:var(--surface-1); border:1px solid var(--rule); border-radius:999px; padding:1px 8px; white-space:nowrap;\">{{ tg }}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ th.hasRisk }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; flex-direction:column; gap:10px;\">\n                      <span style=\"font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#A2503C;\">Risks to watch<\u002Fspan>\n                      <sc-for list=\"{{ th.risks }}\" as=\"rk\" hint-placeholder-count=\"2\">\n                        <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n                          <span style=\"width:10px; height:10px; border-radius:3px; flex:none; margin-top:5px; background:#F5DFDA; border:1px solid #E3BFB6;\"><\u002Fspan>\n                          <div style=\"display:flex; flex-direction:column; gap:5px; min-width:0;\">\n                            <span style=\"font-size:14px; line-height:1.45; text-wrap:pretty;\">{{ rk.text }}<\u002Fspan>\n                            <sc-if value=\"{{ rk.hasTags }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex; flex-wrap:wrap; gap:4px;\"><sc-for list=\"{{ rk.tags }}\" as=\"tg\" hint-placeholder-count=\"1\"><span style=\"font-size:10.5px; color:var(--ink-2); background:var(--surface-1); border:1px solid var(--rule); border-radius:999px; padding:1px 8px; white-space:nowrap;\">{{ tg }}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ canPdf }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; justify-content:flex-end; padding-top:18px; border-top:1px solid var(--rule);\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onPdf }}\" style=\"font-family:'DM Sans', sans-serif; font-weight:700; cursor:pointer; background:var(--surface-0); color:var(--ink); border:1px solid var(--rule); padding:10px 16px; font-size:13.5px; border-radius:10px; display:inline-flex; align-items:center; gap:8px;\" style-hover=\"border-color:var(--amber);\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\"><\u002Fpath><\u002Fsvg>\n              <span>Save as PDF<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showHow }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"max-width:1180px; margin:0 auto; padding:44px 20px 60px; border-top:1px solid var(--rule);\">\n        <h3 style=\"font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(22px, 3vw, 30px); margin:0 0 4px; letter-spacing:-.01em;\">How it works<\u002Fh3>\n        <p style=\"color:var(--ink-2); margin:0 0 26px; font-size:14.5px; max-width:62ch;\">The futures wheel was developed by Jerome Glenn in 1971 as a way to think through the knock-on effects of a change. Claude drafts the consequences; deciding which ones matter is up to you.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:16px;\">\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:15px; color:var(--amber-dark); width:30px; height:30px; border:1px solid var(--rule); border-radius:999px; display:grid; place-items:center;\">1<\u002Fdiv>\n            <h4 style=\"margin:4px 0 0; font-size:16px; font-weight:700; letter-spacing:-.01em;\">Name the change<\u002Fh4>\n            <p style=\"margin:0; color:var(--ink-2); font-size:14px;\">A trend, a policy, a technology, or something you have noticed. One line is enough. Add where you are noticing it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:15px; color:var(--amber-dark); width:30px; height:30px; border:1px solid var(--rule); border-radius:999px; display:grid; place-items:center;\">2<\u002Fdiv>\n            <h4 style=\"margin:4px 0 0; font-size:16px; font-weight:700; letter-spacing:-.01em;\">Read the first ring<\u002Fh4>\n            <p style=\"margin:0; color:var(--ink-2); font-size:14px;\">Direct consequences, coloured by STEEPLE dimension. A dimension can have several, or none, depending on the change.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:15px; color:var(--amber-dark); width:30px; height:30px; border:1px solid var(--rule); border-radius:999px; display:grid; place-items:center;\">3<\u002Fdiv>\n            <h4 style=\"margin:4px 0 0; font-size:16px; font-weight:700; letter-spacing:-.01em;\">Go further out<\u002Fh4>\n            <p style=\"margin:0; color:var(--ink-2); font-size:14px;\">Each consequence leads on to second- and third-order effects, drawn in the outer rings. When the map is drawn, write a summary of the tensions and what to watch.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  \n\n  <\u002Fmain>\n\n  <div aria-hidden=\"true\" style=\"height:clamp(110px, 16vw, 200px); background:url(&quot;a7027692-dba0-4376-9154-2563a6762ae0&quot;) center 78% / cover no-repeat; -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 65%); mask-image:linear-gradient(to bottom, transparent 0%, #000 65%);\"><\u002Fdiv>\n  <footer style=\"border-top:1px solid var(--rule); background:var(--surface-1);\">\n    <div style=\"max-width:1180px; margin:0 auto; padding:28px 20px 34px; display:flex; flex-wrap:wrap; gap:18px 40px; align-items:flex-start; justify-content:space-between; font-size:13px; color:var(--ink-2);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px; max-width:52ch;\">\n        <div style=\"display:flex; align-items:center; gap:9px; font-weight:700; color:var(--ink); font-size:15px;\">\n          <svg sc-camel-view-box=\"0 0 32 32\" width=\"22\" height=\"22\" aria-hidden=\"true\" style=\"flex:none;\"><g style=\"stroke:var(--ink-3);\" stroke-width=\"1.4\" fill=\"none\"><path d=\"M16 16L16 6.5M16 16L25 13M16 16L21.5 24.5M16 16L10.5 24.5M16 16L7 13\"><\u002Fpath><\u002Fg><g style=\"fill:var(--amber);\"><circle cx=\"16\" cy=\"6.5\" r=\"2.8\"><\u002Fcircle><circle cx=\"25\" cy=\"13\" r=\"2.8\"><\u002Fcircle><circle cx=\"21.5\" cy=\"24.5\" r=\"2.8\"><\u002Fcircle><circle cx=\"10.5\" cy=\"24.5\" r=\"2.8\"><\u002Fcircle><circle cx=\"7\" cy=\"13\" r=\"2.8\"><\u002Fcircle><\u002Fg><circle cx=\"16\" cy=\"16\" r=\"4.6\" style=\"fill:var(--ink);\"><\u002Fcircle><\u002Fsvg>\n          <span>Futures Wheel<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; line-height:1.5;\">Adapted from <a href=\"https://futurescape.futurity.science/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;\">futurescape.futurity.science<\u002Fa> for educational use.<\u002Fp>\n        <p style=\"margin:0; line-height:1.5;\">What is a futures wheel? <a href=\"https://knowledgeworks.org/resources/futures-thinking-now-futures-wheels/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;\">Futures Thinking Now: Futures Wheels<\u002Fa>, KnowledgeWorks.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px; align-items:flex-start;\">\n        <p style=\"margin:0; line-height:1.5;\"><a href=\"https://creativecommons.org/licenses/by-nc-nd/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;\">CC BY-NC-ND 4.0<\u002Fa> · 2026 <a href=\"https://welearnwegrow.bio\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink); font-weight:500; text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;\">We Learn, We Grow<\u002Fa><\u002Fp>\n        <a href=\"{{ privacyHref }}\" style=\"font-size:12.5px; color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;\">Privacy<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showHowItWorks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst DIMS = {\n  SOCI: { name: \"Social\", color: \"var(--dim-SOCI)\" },\n  TECH: { name: \"Technological\", color: \"var(--dim-TECH)\" },\n  ECON: { name: \"Economic\", color: \"var(--dim-ECON)\" },\n  ENVI: { name: \"Environmental\", color: \"var(--dim-ENVI)\" },\n  POLI: { name: \"Political\", color: \"var(--dim-POLI)\" },\n  LEGA: { name: \"Legal\", color: \"var(--dim-LEGA)\" },\n  ETHI: { name: \"Ethical\", color: \"var(--dim-ETHI)\" },\n};\nconst DIM_KEYS = Object.keys(DIMS);\nconst LIGHT = { \"--surface-0\":\"#F5F4EE\",\"--surface-1\":\"#EDECE4\",\"--surface-2\":\"#E4E2D8\",\"--rule\":\"#D8D7CE\",\"--ink\":\"#38352F\",\"--ink-2\":\"#6E6A62\",\"--ink-3\":\"#A8A499\",\"--amber\":\"#E0A030\",\"--amber-dark\":\"#B87F20\",\"--shadow\":\"0 1px 2px rgba(56,53,47,.06), 0 8px 24px rgba(56,53,47,.07)\",\"--shadow-lift\":\"0 2px 6px rgba(56,53,47,.10), 0 14px 40px rgba(56,53,47,.13)\",\"--dim-SOCI\":\"#7A9DAD\",\"--dim-TECH\":\"#4F7485\",\"--dim-ECON\":\"#E0A030\",\"--dim-ENVI\":\"#8A9268\",\"--dim-POLI\":\"#B0563C\",\"--dim-LEGA\":\"#8B6F8E\",\"--dim-ETHI\":\"#9E7B4F\" };\nconst DARK = { \"--surface-0\":\"#26241F\",\"--surface-1\":\"#2F2C27\",\"--surface-2\":\"#38352F\",\"--rule\":\"#47433B\",\"--ink\":\"#F0ECE3\",\"--ink-2\":\"#B6B0A4\",\"--ink-3\":\"#837D71\",\"--amber\":\"#E8AE45\",\"--amber-dark\":\"#F0BE63\",\"--shadow\":\"0 1px 2px rgba(0,0,0,.28), 0 8px 24px rgba(0,0,0,.34)\",\"--shadow-lift\":\"0 2px 6px rgba(0,0,0,.36), 0 14px 40px rgba(0,0,0,.46)\",\"--dim-SOCI\":\"#93B4C3\",\"--dim-TECH\":\"#6E9DB1\",\"--dim-ECON\":\"#E8AE45\",\"--dim-ENVI\":\"#A3AC80\",\"--dim-POLI\":\"#CE7357\",\"--dim-LEGA\":\"#A88BAB\",\"--dim-ETHI\":\"#C09A64\" };\n\nconst EXAMPLES = [\n  { label: \"Kids lean on AI instead of reading\", context: \"Easy access to AI, online gaming, and screen immersion threatens reading habits, originality, and real human connection. Rising worries over cognitive safety, cheating on papers, surveillance without choice, and kids treating AI like an altar mean schools must teach digital safety, media literacy, and deep reading habits so technology stays a tool, not a crutch.\" },\n  { label: \"Scarcity pushes families toward self-reliance\", context: \"Severe pollution, water shortages, high housing costs, and crowded cities require practical life skills. Rather than feeling helpless or accepting elite capture of resources, parents want kids to learn to use less, appreciate abundance, grow their own food, and value working with their hands as direct ways to protect the environment.\" },\n  { label: \"Degrees no longer guarantee jobs\", context: \"Studying abroad no longer guarantees work, and traditional jobs are giving way to gig work, income stacking, and trades. In a market that monetizes everything and demands a return on investment, students need non-extractive business sense, family safety nets, and flexible pathways to earn without chasing empty credentials.\" },\n  { label: \"Public life grows polarized and combative\", context: \"Growing authoritarianism, speech restrictions, wars, nationalism, and identity politics make public life combative and polarized. Parents who grew up steering away from politics now want to give their kids the courage, social awareness, and understanding of the government-citizen relationship needed to stand up and create real change.\" },\n  { label: \"Rising racism strains mixed-culture kids\", context: \"Children navigate bi-ethnic identities between India, abroad, and other cultures at a time of anti-cosmopolitanism and racism. Learning must help kids understand their lineage and family roots while moving beyond narrow interest groups, breaking through loneliness, and building real bonds in diverse, changing classrooms.\" },\n  { label: \"Elites capture shared public resources\", context: \"A growing wealth gap and elite control over basics demand a focus on the common good. Schooling needs to guide young people toward non-extractive systems, showing them how to protect shared resources and care for their broader community rather than focusing only on personal gain.\" },\n];\n\nconst SEED = {\n  trend: \"AI tutors replace teachers\",\n  first: [\n    { id: \"s1\", tone: \"neg\", dim: \"SOCI\", title: \"Student–teacher bonds weaken\", detail: \"Mentorship and role-model relationships that shape character and confidence thin out when instruction is delivered by software.\" },\n    { id: \"s2\", tone: \"neg\", dim: \"ECON\", title: \"Teaching jobs contract sharply\", detail: \"Demand for classroom teachers falls, and education spending shifts from salaries toward platform licences.\" },\n    { id: \"s3\", tone: \"mixed\", dim: \"TECH\", title: \"Learning data becomes the asset\", detail: \"Every keystroke, pause and error is captured, making student behavioural data the core product of schooling.\" },\n    { id: \"s4\", tone: \"neg\", dim: \"ETHI\", title: \"Algorithmic bias shapes curricula\", detail: \"What a model emphasises or omits quietly sets what a generation is taught, with no teacher present to push back.\" },\n    { id: \"s5\", tone: \"neg\", dim: \"LEGA\", title: \"Liability for learning gets murky\", detail: \"When a tutor gives wrong or harmful guidance, responsibility drifts between vendors, schools and parents.\" },\n    { id: \"s6\", tone: \"neg\", dim: \"POLI\", title: \"Ed-tech lobbying reshapes policy\", detail: \"A few platform providers gain outsized influence over public education standards and procurement.\" },\n    { id: \"s7\", tone: \"neg\", dim: \"SOCI\", title: \"Equity gap widens by access\", detail: \"Children with reliable devices and connectivity pull ahead while others fall further behind.\" },\n    { id: \"s8\", tone: \"mixed\", dim: \"ENVI\", title: \"Campus footprint shifts to data centres\", detail: \"Fewer physical schools cut commuting and building energy, but always-on tutors raise data-centre demand.\" },\n  ],\n  branches: {\"s1\":[{\"dim\":\"SOCI\",\"tone\":\"neg\",\"title\":\"Fewer trusted adults for children\",\"detail\":\"Children lose a non-family adult who notices distress early.\",\"kids\":[{\"dim\":\"SOCI\",\"tone\":\"neg\",\"title\":\"Mental-health issues surface later\",\"detail\":\"Problems once caught in class go unnoticed until they escalate.\"}]},{\"dim\":\"ETHI\",\"tone\":\"neg\",\"title\":\"Character education gets sidelined\",\"detail\":\"Values once modelled by teachers are left out of software lessons.\",\"kids\":[{\"dim\":\"POLI\",\"tone\":\"mixed\",\"title\":\"Parents demand values curricula\",\"detail\":\"Families push schools to reintroduce civics and ethics as explicit subjects.\"}]}],\"s2\":[{\"dim\":\"ECON\",\"tone\":\"neg\",\"title\":\"Loss of stable middle-class jobs\",\"detail\":\"Teaching was a secure route into the middle class, especially for women.\",\"kids\":[{\"dim\":\"SOCI\",\"tone\":\"neg\",\"title\":\"Women's workforce participation drops\",\"detail\":\"Fewer teaching posts remove a common, respected job for women in small towns.\"}]},{\"dim\":\"ECON\",\"tone\":\"pos\",\"title\":\"New roles as learning coaches\",\"detail\":\"Some teachers move into mentoring and supervising AI-led study.\",\"kids\":[{\"dim\":\"ECON\",\"tone\":\"mixed\",\"title\":\"Coaching becomes a premium service\",\"detail\":\"Wealthier families pay for human coaches while others rely on software alone.\"}]}],\"s3\":[{\"dim\":\"TECH\",\"tone\":\"neg\",\"title\":\"Profiles follow students for life\",\"detail\":\"Early learning records feed later admissions and hiring decisions.\",\"kids\":[{\"dim\":\"LEGA\",\"tone\":\"mixed\",\"title\":\"Push for data-expiry laws\",\"detail\":\"Advocates press for student data to be deleted after schooling ends.\"}]},{\"dim\":\"TECH\",\"tone\":\"pos\",\"title\":\"Lessons adapt to each learner\",\"detail\":\"Detailed data lets tutors pace material to individual gaps.\",\"kids\":[{\"dim\":\"SOCI\",\"tone\":\"pos\",\"title\":\"Struggling learners catch up faster\",\"detail\":\"Students who fell behind get targeted practice without stigma.\"}]}],\"s4\":[{\"dim\":\"ETHI\",\"tone\":\"neg\",\"title\":\"Local languages and histories fade\",\"detail\":\"Models trained on dominant-language content underrepresent regional knowledge.\",\"kids\":[{\"dim\":\"SOCI\",\"tone\":\"neg\",\"title\":\"Children disconnect from local culture\",\"detail\":\"Home knowledge seems less valid than what the tutor teaches.\"}]},{\"dim\":\"POLI\",\"tone\":\"mixed\",\"title\":\"Curriculum control becomes contested\",\"detail\":\"Governments and vendors compete over who sets model content.\",\"kids\":[{\"dim\":\"POLI\",\"tone\":\"neg\",\"title\":\"Education becomes a propaganda channel\",\"detail\":\"Whoever controls the model can shape what a whole cohort believes.\"}]}],\"s5\":[{\"dim\":\"LEGA\",\"tone\":\"neg\",\"title\":\"Families bear the risk of errors\",\"detail\":\"Vendor terms shift responsibility for harmful advice onto users.\",\"kids\":[{\"dim\":\"ECON\",\"tone\":\"neg\",\"title\":\"Insurance and litigation costs rise\",\"detail\":\"Schools buy cover and fight disputes that once did not exist.\"}]},{\"dim\":\"LEGA\",\"tone\":\"pos\",\"title\":\"New standards for AI in schools\",\"detail\":\"Regulators set audit and accuracy rules for educational models.\",\"kids\":[{\"dim\":\"ECON\",\"tone\":\"mixed\",\"title\":\"Small vendors priced out\",\"detail\":\"Compliance costs favour large platforms over local developers.\"}]}],\"s6\":[{\"dim\":\"POLI\",\"tone\":\"neg\",\"title\":\"Procurement locks in a few vendors\",\"detail\":\"Long contracts make switching platforms costly for public systems.\",\"kids\":[{\"dim\":\"ECON\",\"tone\":\"neg\",\"title\":\"Public budgets lose bargaining power\",\"detail\":\"Vendors raise licence fees once schools depend on them.\"}]},{\"dim\":\"POLI\",\"tone\":\"pos\",\"title\":\"Teachers' unions mobilise\",\"detail\":\"Organised teachers push back on policy shaped by platforms.\",\"kids\":[{\"dim\":\"POLI\",\"tone\":\"mixed\",\"title\":\"Education becomes an election issue\",\"detail\":\"Parties campaign on protecting or automating classrooms.\"}]}],\"s7\":[{\"dim\":\"SOCI\",\"tone\":\"neg\",\"title\":\"Rural and poor students fall behind\",\"detail\":\"Without devices and bandwidth, children miss the main mode of instruction.\",\"kids\":[{\"dim\":\"ECON\",\"tone\":\"neg\",\"title\":\"Inequality hardens across generations\",\"detail\":\"Early gaps compound into lower earnings and mobility.\"}]},{\"dim\":\"TECH\",\"tone\":\"pos\",\"title\":\"Public device and data programmes\",\"detail\":\"Governments fund devices and connectivity to close the gap.\",\"kids\":[{\"dim\":\"TECH\",\"tone\":\"mixed\",\"title\":\"Cheap devices bring surveillance\",\"detail\":\"Subsidised hardware ships with tracking students cannot opt out of.\"}]}],\"s8\":[{\"dim\":\"ENVI\",\"tone\":\"neg\",\"title\":\"Water stress near data centres\",\"detail\":\"Cooling demand competes with local water supplies.\",\"kids\":[{\"dim\":\"POLI\",\"tone\":\"neg\",\"title\":\"Local conflict over water use\",\"detail\":\"Communities near facilities contest who gets water in dry seasons.\"}]},{\"dim\":\"ENVI\",\"tone\":\"pos\",\"title\":\"Less daily commuting to school\",\"detail\":\"Fewer trips cut traffic and air pollution around campuses.\",\"kids\":[{\"dim\":\"SOCI\",\"tone\":\"mixed\",\"title\":\"Children spend more time indoors\",\"detail\":\"Less travel also means less outdoor time and informal play.\"}]}]},\n};\nfunction seedSeconds() {\n  const out = {};\n  Object.keys(SEED.branches).forEach((fid) => {\n    out[fid] = SEED.branches[fid].map((b, i) => ({ ...b, id: fid + \"-\" + i, kids: (b.kids || []).map((k, j) => ({ ...k, id: fid + \"-\" + i + \"-\" + j })) }));\n  });\n  return out;\n}\n\nconst LENS_FIELDS = [\n  { key: \"age\", label: \"Age\", options: [\"Under 18\", \"18–24\", \"25–39\", \"40–59\", \"60+\"] },\n  { key: \"gender\", label: \"Gender\", options: [\"Woman\", \"Man\", \"Non-binary\", \"Prefer not to say\"] },\n  { key: \"grewUp\", label: \"Where I grew up\", placeholder: \"e.g. a village in Tamil Nadu\" },\n  { key: \"liveNow\", label: \"Where I live now\", placeholder: \"e.g. Bengaluru\" },\n  { key: \"edu\", label: \"Education\", options: [\"School\", \"First in family at college\", \"Graduate\", \"Postgraduate\", \"Vocational or trade\"] },\n  { key: \"econ\", label: \"Economic situation\", options: [\"Precarious\", \"Lower income\", \"Middle income\", \"Comfortable\", \"Wealthy\"] },\n  { key: \"role\", label: \"Livelihood\", placeholder: \"e.g. smallholder farmer, schoolteacher\" },\n  { key: \"influence\", label: \"Influence\", options: [\"Little say, even in my own life\", \"Within my household\", \"In my workplace or community\", \"Across an organisation or sector\", \"Over public policy or markets\"] },\n  { key: \"identity\", label: \"Other identities worth mentioning\", placeholder: \"e.g. first-generation migrant, Dalit, disabled\" },\n];\nconst LENS_LABELS = {};\nLENS_FIELDS.forEach((f) => { LENS_LABELS[f.key] = f.label; });\nfunction lensText(lens) {\n  const t = Object.keys(LENS_LABELS).filter((k) => lens[k] && String(lens[k]).trim()).map((k) => LENS_LABELS[k] + \": \" + String(lens[k]).trim()).join(\"; \");\n  return t ? t + \" (infer urban/rural setting and any move between places from where they grew up and where they live now)\" : \"\";\n  return Object.keys(LENS_LABELS).filter((k) => lens[k] && String(lens[k]).trim()).map((k) => LENS_LABELS[k] + \": \" + String(lens[k]).trim()).join(\"; \");\n}\nfunction lensShort(lens) {\n  return [\"role\", \"age\", \"liveNow\", \"econ\", \"gender\", \"edu\", \"grewUp\", \"identity\"].map((k) => lens[k] && String(lens[k]).trim()).filter(Boolean).join(\" · \");\n}\nconst PLAIN = \"WRITING STYLE: Use plain, everyday English that a 14-year-old could follow. Short common words, short sentences. No jargon, buzzwords, or long chains of nouns. Say what happens and to whom.\\n\\n BALANCE (THE MIDDLE WAY): Do not assume a technology or trend is inevitable, neutral, or good, and do not assume it is all bad. Name harms plainly, including harms to people, communities and the living world, and name real benefits honestly. Do not frame harm as the price of progress, and do not default to fixing technology with more technology. Keep the full range of choices open.\\n\\n\";\nconst STANCES = { refuse: { label: \"Refuse or pause\", color: \"#A2503C\" }, reshape: { label: \"Reshape\", color: \"#B87F20\" }, adopt: { label: \"Adopt with care\", color: \"#5E7A4A\" } };\nconst REPORT_PH = \"Draw a map first, then write the report.\";\nconst SECTORS = [\"Finance\", \"Industry\", \"Environment\", \"Energy\", \"Agriculture\", \"Defence\", \"Education\", \"Science and technology\", \"Health and wellbeing\", \"Law and justice\", \"Travel and tourism\", \"Religion and spirituality\"];\nconst SEED_REPORT = {\"insights\":[{\"key\":\"short\",\"name\":\"Short term\",\"range\":\"0–10 years\",\"items\":[\"Schools cut teaching posts and shift budgets to AI tutor licences, often before results are clear.\",\"Children without good devices or internet fall behind, and the gap shows in exam results.\",\"Families are left to sort out tutor mistakes because the rules on who is responsible are unclear.\",\"Some teachers become learning coaches, but mostly in private and better-funded schools.\"]},{\"key\":\"mid\",\"name\":\"Medium term\",\"range\":\"10–25 years\",\"items\":[\"A generation reaches adulthood having learned mostly from software, with fewer adult mentors outside the family.\",\"Human teaching becomes a premium service, splitting schooling into two tiers by income.\",\"Public education depends on a few tech companies that shape what is taught and what it costs.\",\"Childhood learning records start to shape who gets into college, gets hired or gets a loan.\"]},{\"key\":\"long\",\"name\":\"Long term\",\"range\":\"25+ years\",\"items\":[\"Teaching as a mass profession largely disappears, and with it a key route into the middle class, especially for women.\",\"Local languages, histories and ways of knowing thin out as children learn from the same few models.\",\"Whoever controls the tutor models holds lasting influence over what a society believes and values.\",\"Gaps that began in childhood become fixed differences in health, income and power across generations.\"]}],\"themes\":[{\"name\":\"Children get less care from adults\",\"summary\":\"Fewer teachers means fewer adults who notice when a child is struggling or needs guidance.\",\"interventions\":[{\"stance\":\"refuse\",\"text\":\"Keep a human teacher in every classroom by law, and refuse contracts that replace teaching posts with software.\",\"tags\":[\"Education\",\"Law and justice\"]},{\"stance\":\"reshape\",\"text\":\"Train local elders, youth and mothers' groups as paid mentors who work alongside any tutor, so care stays local.\",\"tags\":[\"Education\",\"Health and wellbeing\"]},{\"stance\":\"adopt\",\"text\":\"Use AI tutors only for extra practice after school, with teachers choosing when and how children use them.\",\"tags\":[\"Education\"]}],\"risks\":[{\"text\":\"Children's mental-health problems are noticed later, when they are harder to help.\",\"tags\":[\"Health and wellbeing\"]}]},{\"name\":\"Who owns what is known about a child\",\"summary\":\"AI tutors record everything a child does, and it is unclear who keeps that data or who is to blame for mistakes.\",\"interventions\":[{\"stance\":\"refuse\",\"text\":\"Ban private companies from collecting children's learning data, as some places already do for health data.\",\"tags\":[\"Law and justice\"]},{\"stance\":\"reshape\",\"text\":\"Set up community data trusts so families, not platforms, decide what is kept, for how long and why.\",\"tags\":[\"Science and technology\",\"Law and justice\"]},{\"stance\":\"adopt\",\"text\":\"Allow tools that work offline and store nothing, so children can learn without being tracked.\",\"tags\":[\"Science and technology\"]}],\"risks\":[{\"text\":\"Old school records are used to judge people for loans and jobs.\",\"tags\":[\"Finance\",\"Law and justice\"]},{\"text\":\"Cheap school devices track children without a way to say no.\",\"tags\":[\"Science and technology\"]}]},{\"name\":\"Richer children get more\",\"summary\":\"Children with good devices and paid human coaches pull ahead, while others are left with software alone.\",\"interventions\":[{\"stance\":\"refuse\",\"text\":\"Spend public money on more teachers, smaller classes and libraries before any spending on AI tutors.\",\"tags\":[\"Education\",\"Finance\"]},{\"stance\":\"reshape\",\"text\":\"Run shared learning centres in rural and poor areas as cooperatives, owned and managed by local people.\",\"tags\":[\"Education\",\"Industry\"]},{\"stance\":\"adopt\",\"text\":\"Where teachers are truly missing, offer free AI tutors to the children with least, never as a paid extra.\",\"tags\":[\"Education\",\"Finance\"]}],\"risks\":[{\"text\":\"Gaps that start in school carry on into pay and life chances.\",\"tags\":[\"Finance\",\"Industry\"]}]},{\"name\":\"Who decides what children learn\",\"summary\":\"The companies and governments behind the AI decide what is taught, and local languages and history can get left out.\",\"interventions\":[{\"stance\":\"refuse\",\"text\":\"Pause new AI tutor rollouts until communities and teachers have reviewed what they teach and leave out.\",\"tags\":[\"Education\",\"Law and justice\"]},{\"stance\":\"reshape\",\"text\":\"Fund open-source tutors built with local teachers in regional and Indigenous languages, owned by the public.\",\"tags\":[\"Science and technology\",\"Education\"]},{\"stance\":\"adopt\",\"text\":\"Use AI to translate and record elders' stories and local knowledge, with communities deciding who can use them.\",\"tags\":[\"Education\",\"Religion and spirituality\"]}],\"risks\":[{\"text\":\"A few companies or governments use AI tutors to shape what children believe.\",\"tags\":[\"Defence\",\"Education\"]},{\"text\":\"Long contracts make it hard for schools to switch or push back on price.\",\"tags\":[\"Finance\"]}]},{\"name\":\"The hidden cost to the planet\",\"summary\":\"Fewer school trips help, but the computers running AI tutors use a lot of water and power.\",\"interventions\":[{\"stance\":\"refuse\",\"text\":\"Refuse new data centres in water-stressed areas, and put local water needs ahead of computing.\",\"tags\":[\"Environment\",\"Energy\"]},{\"stance\":\"reshape\",\"text\":\"Require data centres to run on renewable power, return water to local watersheds and share income with nearby villages.\",\"tags\":[\"Energy\",\"Environment\"]},{\"stance\":\"adopt\",\"text\":\"Use small, low-power tools on local devices instead of large models in distant data centres.\",\"tags\":[\"Science and technology\",\"Energy\"]}],\"risks\":[{\"text\":\"Towns near data centres run sh
